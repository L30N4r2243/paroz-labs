version: "3.9"
services:
  backend:
    env_file:
      - .env
    build: .
    container_name: flask-backend
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
      

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: next-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:5000 # URL del backend para el frontend en desarrollo
    depends_on:
      - backend
